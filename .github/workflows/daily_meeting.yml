name: Daily AI Investment Meeting

on:
  schedule:
    # 毎日 日本時間 9:00 (UTC 0:00) に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '休場日でも強制実行する場合は true を選択'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  run-daily-simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily AI investment meeting
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: Commit and push updated data, reports, and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ docs/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily simulation" && git push)
